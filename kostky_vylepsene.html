<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hrací kostka</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
}
.container {
    width: 360px;
    padding: 35px 30px;
    background: rgba(255,255,255,.97);
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}
h1 { margin: 0 0 8px; color: #222; }
.subtitle { color: #777; margin: 0 0 25px; }
.dice {
    width: 120px;
    height: 120px;
    margin: 25px auto;
    background: white;
    border: 4px solid #222;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 58px;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
}
.dice.rolling { animation: roll .5s ease; }
@keyframes roll {
    0% { transform: rotate(0) scale(1); }
    25% { transform: rotate(90deg) scale(1.08); }
    50% { transform: rotate(180deg) scale(.92); }
    75% { transform: rotate(270deg) scale(1.08); }
    100% { transform: rotate(360deg) scale(1); }
}
button {
    width: 100%;
    background: #007bff;
    color: white;
    border: none;
    padding: 13px 20px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
}
button:hover { background: #0056b3; transform: translateY(-2px); }
button:active { transform: translateY(0); }
.stats {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
    color: #555;
}
.number { font-weight: bold; color: #007bff; }
</style>
</head>
<body>
<div class="container">
    <h1>🎲 Hrací kostka</h1>
    <p class="subtitle">Klikni na tlačítko a hoď kostkou</p>
    <div id="dice" class="dice">?</div>
    <button onclick="hodKostkou()">Hodit kostkou</button>
    <div class="stats">
        Počet hodů: <span id="pocetHodu" class="number">0</span>
    </div>
</div>

<script>
let pocetHodu = 0;

function hodKostkou() {
    const kostka = document.getElementById("dice");
    const pocet = document.getElementById("pocetHodu");
    const cislo = Math.floor(Math.random() * 6) + 1;

    kostka.classList.remove("rolling");
    void kostka.offsetWidth;
    kostka.classList.add("rolling");

    kostka.textContent = cislo;
    pocetHodu++;
    pocet.textContent = pocetHodu;
}
</script>
</body>
</html>
